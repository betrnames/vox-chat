  <rect x="80" y="80" width="4" height="120" rx="2" fill="#0A0A0F"/>
  <!-- headline -->
  <text x="100" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="600" fill="#0A0A0F" letter-spacing="-0.5">The 2-Hour Window</text>
  <!-- sub -->
  <text x="100" y="170" font-family="monospace" font-size="16" fill="#0A0A0FCC" letter-spacing="2">AUTOMATED REVIEW REQUESTS</text>
